name: Bug report
description: Something is not working the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The two fields that most often decide whether a bug is
        fixable are **what you expected** and **how you are running it**, so please
        do not skip those.

        Found a security problem? Do not file it here. See
        [SECURITY.md](https://github.com/morgenruf/.github/blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      placeholder: The standup fired but three people never received a DM.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a standup with participants picked in the dashboard
        2. Wait for it to fire
        3. Two of the five get nothing
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, chart version, or image tag.
      placeholder: v1.4.0
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How are you running it
      options:
        - Helm on Kubernetes
        - Docker Compose
        - AWS template from aws-deploy
        - From source
        - Something else
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >
        Redact tokens, signing secrets and anything identifying your workspace.
        Slack user and channel ids identify real people, so replace them.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues
          required: true
        - label: I removed tokens, secrets and identifying data from anything I pasted
          required: true
